<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tombol</title>

    <style>
        body {
            background-color: aliceblue;
            font-family: Arial, sans-serif;
            padding: 30px;
        }

        h2 {
            color: #333333;
            font-size: 20px;
        }

        .btn {
            display: inline-block;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: bold;
            text-decoration: none;
            border: none;
            cursor: pointer;
        }

        .button-group .btn {
            margin-right: 10px;
            margin-bottom: 10px;
        }

        .btn-primary {
            background-color: lightblue;
            color: white;
        }

        .btn-secondary {
            background-color: #F5B8D0;
            color: #333333;
        }

        .btn-outline {
            background-color: white;
            border: 2px solid #8ABBD3;
            color: #333333;
        }

        .btn-send {
            background-color: rgb(170, 205, 230);
            color: white;
        }

        .btn-secondary, .btn-outline {
            color: #333333;
        }

        .btn-primary:hover {
            background-color: #78AFCB;
        }

        .btn-secondary:hover {
            background-color: #E99DBD;
        }

        .btn-outline:hover {
            background-color: #DCEEF7;
        }

        .btn-send:hover {
            background-color: rgba(120, 170, 210, 0.9);
        }

    </style>
</head>

<body>

    <h2>Tombol</h2>

    <div class="button-group">
        <button class="btn btn-primary">Lihat Proyek</button>

        <button class="btn btn-secondary">Unduh CV</button>

        <button class="btn btn-outline">Hubungi Saya</button>

        <button class="btn btn-send">Kirim Pesan</button>

    </div>

    <footer>
         <a href="../index.html">Kembali ke Beranda</a>
    </footer>
</body>
</html>
