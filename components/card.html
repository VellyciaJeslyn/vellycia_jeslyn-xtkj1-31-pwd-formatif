<!--
Perhitungan lebar kartu tanpa box-sizing:
320px + padding kiri-kanan 40px + border 4px = 364px
-->

<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kartu Proyek</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background-color: #F4F6FA;
            font-family: Arial, sans-serif;
        }

        .card {
            width: 320px;
            padding: 20px;
            border: 2px solid #34495E;
            margin: 30px auto;
            background-color: white;
        }

        .card img {
            width: 100%;
            height: 160px;
            display: block;
            object-fit: cover;
        }

        .card h3 {
            color: #263D5A;
            margin-bottom: 8px;
        }

        .card p,
        .card a {
            font-size: 15px;
        }

        .card p {
            color: #555555;
        }

        .card a {
            color: #E58B55;
        }

        footer {
            text-align: center;
            margin-top: 30px;
        }
    </style>
</head>

<body>

    <main>
        <div class="card">
            <img src="../assets/images/proyek.jpg" alt="Gambar Proyek">
            

            <h3>Website Vellycia Jeslyn</h3>

            <p>
                Ini adalah latihan membuat website tugas Vellycia Jeslyn.
                Website dibuat menggunakan HTML dan CSS.
            </p>

            <a href="#">Lihat Proyek</a>
        </div>
    </main>

    <footer>
        <a href="../index.html">Kembali ke Beranda</a>
    </footer>

</body>
</html>
