
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulir Kontak</title>

    <style>
        body {
            background-color: #f4f7fa;
            font-family: Arial, Helvetica, sans-serif;
            margin: 0;
        }

        #contact {
            padding: 40px 20px;
        }

        .contact-form {
            width: 400px;
            max-width: 100%;
            box-sizing: border-box;
            margin: 0 auto;
            padding: 24px;
            border: 1px solid #8797ad;
            border-radius: 5px;
            background-color: white;
        }

        .contact-form h2 {
            text-align: center;
            color: #19314f;
            font-size: 22px;
            margin-top: 0;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            font-weight: bold;
            margin-bottom: 6px;
            font-size: 14px;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            box-sizing: border-box;
            padding: 10px;
            border: 1px solid #cccccc;
            border-radius: 4px;
            font-family: Arial, Helvetica, sans-serif;
            font-size: 14px;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #19314f;
            background-color: #e8eef7;
        }

        .form-group textarea {
            resize: vertical;
        }

        .btn-submit {
            background-color: #19314f;
            color: white;
            padding: 10px 16px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }

        .btn-submit:hover {
            background-color: #e58b55;
        }
    </style>
</head>

<body>

    <section id="contact">
        <form class="contact-form">
            <h2>Hubungi Saya</h2>

            <div class="form-group">
                <label for="nama">Nama</label>
                <input type="text" id="nama" name="nama">
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email">
            </div>

            <div class="form-group">
                <label for="pesan">Pesan</label>
                <textarea id="pesan" name="pesan" rows="4"></textarea>
            </div>

            <button type="submit" class="btn-submit">
                Kirim Pesan
            </button>
        </form>
    </section>

</body>
</html>
